name: Release JoeAnimeDB Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Resolve release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $packageVersion. Expected $expectedTag."
          }
          "RELEASE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$expectedTag" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify build tools
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/.bin/vite.cmd")) {
            throw "Vite was not installed."
          }
          if (-not (Test-Path "node_modules/.bin/electron-builder.cmd")) {
            throw "electron-builder was not installed."
          }

      - name: Build Windows update
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win nsis --publish never

      - name: Create update metadata
        shell: pwsh
        run: |
          $installerName = "JoeAnimeDB-Setup-$env:RELEASE_VERSION.exe"
          $installerPath = "dist-desktop/$installerName"
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not generated: $installerPath"
          }

          $installerBytes = [System.IO.File]::ReadAllBytes($installerPath)
          $sha512Bytes = [System.Security.Cryptography.SHA512]::HashData($installerBytes)
          $sha512 = [Convert]::ToBase64String($sha512Bytes)
          $size = (Get-Item $installerPath).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          $metadata = @(
            "version: $env:RELEASE_VERSION",
            "files:",
            "  - url: $installerName",
            "    sha512: $sha512",
            "    size: $size",
            "path: $installerName",
            "sha512: $sha512",
            "releaseDate: '$releaseDate'"
          )
          Set-Content -Path "dist-desktop/latest.yml" -Value $metadata -Encoding utf8

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            "dist-desktop/JoeAnimeDB-Setup-$env:RELEASE_VERSION.exe",
            "dist-desktop/JoeAnimeDB-Setup-$env:RELEASE_VERSION.exe.blockmap",
            "dist-desktop/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Required release asset was not generated: $asset"
            }
          }

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "dist-desktop/JoeAnimeDB-Setup-$env:RELEASE_VERSION.exe",
            "dist-desktop/JoeAnimeDB-Setup-$env:RELEASE_VERSION.exe.blockmap",
            "dist-desktop/latest.yml"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --prerelease `
              --title "JoeAnimeDB $env:RELEASE_VERSION" `
              --notes-file "RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release $env:RELEASE_TAG."
            }
          }

          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "JoeAnimeDB $env:RELEASE_VERSION" `
            --notes-file "RELEASE_NOTES.md" `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to apply release notes to $env:RELEASE_TAG."
          }

          gh release upload $env:RELEASE_TAG $assets `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload release assets for $env:RELEASE_TAG."
          }

  release-linux:
    name: Release Linux AppImage
    needs: release-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Resolve release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" != "${expected_tag}" ]]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version ${package_version}. Expected ${expected_tag}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${package_version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${expected_tag}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build Linux AppImage
        run: |
          npm run build
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Verify Linux release assets
        shell: bash
        run: |
          assets=(
            "dist-desktop/JoeAnimeDB-${RELEASE_VERSION}.AppImage"
            "dist-desktop/latest-linux.yml"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Required Linux release asset was not generated: $asset" >&2
              exit 1
            fi
          done

      - name: Publish Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            "dist-desktop/JoeAnimeDB-${RELEASE_VERSION}.AppImage"
            "dist-desktop/latest-linux.yml"
          )
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  release-android:
    name: Release Android APK
    needs: release-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" != "${expected_tag}" ]]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version ${package_version}. Expected ${expected_tag}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${package_version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${expected_tag}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Sync Android project
        run: npm run android:sync

      - name: Build Android APK
        run: npm run android:debug

      - name: Prepare Android release asset
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="JoeAnimeDB-${RELEASE_VERSION}-Android.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "Android APK was not generated: $source_apk" >&2
            exit 1
          fi
          cp "$source_apk" "$release_apk"
          echo "ANDROID_RELEASE_APK=$release_apk" >> "$GITHUB_ENV"

      - name: Publish Android release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "$ANDROID_RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

